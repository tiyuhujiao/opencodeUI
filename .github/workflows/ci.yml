name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  build-test-package:
    name: Verify (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            webview-ui/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install webview dependencies
        run: npm --prefix webview-ui ci

      - name: Check
        run: npm run check

      - name: Install OpenCode on macOS
        if: runner.os == 'macOS'
        run: npm install --global opencode-ai@1.18.15

      - name: Verify OpenCode on macOS
        if: runner.os == 'macOS'
        run: opencode --version

      - name: Run VS Code extension smoke test on macOS
        if: runner.os == 'macOS'
        run: npm run test:extension

      - name: Package VSIX
        if: runner.os == 'Linux'
        run: npm run package

      - name: Upload VSIX
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v7
        with:
          name: opencode-ui-vsix
          path: vsix/opencode-ui-vscode-*.vsix
          if-no-files-found: error
